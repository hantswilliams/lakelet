[package]
name = "lakelet-app"
version = "0.1.0"
description = "Lakelet desktop shell: a Tauri window over the lakelet sidecar"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "lakelet_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
