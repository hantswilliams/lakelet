# Spark 3.5 against Lakelet's catalog (the `catalog` compose service) and the RustFS warehouse.
# Iceberg jars come from Maven on first use and stay in the spark-ivy volume.
spark.jars.packages                              org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.9.2,org.apache.iceberg:iceberg-aws-bundle:1.9.2
spark.jars.ivy                                   /opt/ivy
spark.sql.extensions                             org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lakelet                        org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakelet.type                   rest
spark.sql.catalog.lakelet.uri                    http://catalog:8181
spark.sql.catalog.lakelet.io-impl                org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakelet.s3.endpoint            http://s3:9000
spark.sql.catalog.lakelet.s3.path-style-access   true
spark.sql.catalog.lakelet.s3.access-key-id       lakelet
spark.sql.catalog.lakelet.s3.secret-access-key   lakeletlakelet
spark.sql.catalog.lakelet.client.region          us-east-1
spark.sql.defaultCatalog                         lakelet
spark.ui.enabled                                 false
spark.driver.memory                              1g
